server:
  port: 8080
  servlet:
    session:
      timeout: 1m # 1 minutes

logging:
  level:
    root: INFO
    com.calcpro.flowmaster: INFO
    org.springframework.security: TRACE

spring:
  application:
    name: flow-master
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
  h2:
    console:
      enabled: true
      path: /h2-console
#  datasource:
#    driver-class-name: org.postgresql.Driver
#    url: ${DB_URL}
#    username: ${DB_USER}
#    password: ${DB_PASS}
#  jpa:
#    hibernate:
#      ddl-auto: create-drop #update
#    show-sql: true
#  liquibase:
#    change-log: classpath:/liquibase/changelog-master.yml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: profile, email